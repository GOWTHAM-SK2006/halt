server:
  port: ${PORT:8080}

spring:
  application:
    name: halt-charge-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/haltcharge}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:halt-charge-super-secret-jwt-key-minimum-32-chars-long}
    expiration-ms: 86400000  # 24 hours

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TtPOyCBVSsMzUT}
    key-secret: ${RAZORPAY_KEY_SECRET:rXTMzEyRsN6kbPVDvOctX4ka}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:halt2024}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

logging:
  level:
    com.haltcharge: INFO
    org.springframework.security: WARN
